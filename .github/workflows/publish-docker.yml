name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image to publish (CUDA 13.0 GPU, or CPU only)
        type: choice
        required: true
        default: cuda
        options:
          - cuda
          - cpu

permissions:
  contents: read

# Keep overlapping manual runs from publishing the same tags simultaneously.
concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases the image name, as GHCR requires.
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long,suffix=-${{ inputs.variant }}
            type=raw,value=${{ inputs.variant }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ inputs.variant == 'cuda' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ inputs.variant }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            TORCH_INDEX=${{ inputs.variant == 'cuda' && 'cu130' || 'cpu' }}
            LAYA_DEVICE=${{ inputs.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-docker-${{ inputs.variant }}
          cache-to: type=gha,scope=publish-docker-${{ inputs.variant }},mode=max
